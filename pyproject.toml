[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "0.1.0"
description = "An evidence-auditing multi-agent diagnostic workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["clinical-decision-support", "multi-agent", "diagnosis", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# No runtime dependencies: the workflow uses only the standard library, and
# connects to models and retrieval indices through the protocols in
# genesis.tools.base and genesis.llm.base.
dependencies = []

[project.urls]
Homepage = "https://github.com/jdy18/GENESIS"
Source = "https://github.com/jdy18/GENESIS"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.ruff]
line-length = 88
target-version = "py310"
